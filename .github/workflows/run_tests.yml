name: Tests

# Define when to run
on:
  schedule:
    - cron: '30 4 1 * *'

  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize]

  push:
    branches:
      - main

# Env variables
env:
  CACHE_NUMBER: 0  # increase to reset cache manually

# Jobs
jobs:

  # check whether #skiptests is in pull request message or commit message:
  # The option #skiptests skips the tests
  check_skiptests:
    runs-on: ubuntu-latest
    outputs:
      skiptests: ${{ steps.check_skiptests.outputs.skiptests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for '#skiptests' in pull request title or body
        id: check_skiptests
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$TITLE" =~ \#skiptests || "$BODY" =~ \#skiptests ]]; then
            skip="true"
          else
            skip="false"
          fi

          echo "skiptests=$skip" >> $GITHUB_ENV
          echo "skiptests=$skip" >> $GITHUB_OUTPUT
          echo "PR Title: $TITLE"
          echo "PR Body: $BODY"
          echo "skiptests=$skip"

  matrix_prep:
    if: ${{ github.repository == 'ZEN-universe/ZEN-creator' }}
    needs: check_skiptests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Env File
        id: check-env-file
        uses: tj-actions/changed-files@v46
        with:
          files: |
            zen_creator_env.yml

      - name: Set Env
        # trigger if env file change or on schedule
        if: ${{ steps.check-env-file.outputs.any_changed == 'true' || github.event_name == 'schedule' }}
        run: echo "ENV_STATE=env_change" >> $GITHUB_ENV

      - id: set-matrix
        uses: JoshuaTheMiller/conditional-build-matrix@main
        with:
          # Run filter -> see matrix_includes.json!
          filter: '[?runs_when==`${{ env.ENV_STATE }}` || runs_when==`${{ github.event_name }}` || runs_when==`always`]'

  build:
    if: ${{ github.repository == 'ZEN-universe/ZEN-creator' }}
    # the testing
    needs: [matrix_prep, check_skiptests]
    strategy:
      fail-fast: false  # if true all jobs are cancelled if one fails
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      SKIPTESTS: ${{ needs.check_skiptests.outputs.skiptests }}
    # login shell on every platform, so the conda env is on the PATH
    defaults:
      run:
        shell: bash -l {0}
    steps:

      - name: Check the value of SKIPTESTS
        run: |
          echo "skiptests output: ${{ env.SKIPTESTS }}"

      # checkout PR commit
      - uses: actions/checkout@v4
        if: ${{ env.SKIPTESTS == 'false' }}

      # setup the conda env
      - name: Setup Miniforge
        if: ${{ env.SKIPTESTS == 'false' }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: zen-creator-env
          use-mamba: true

      # date for the cache
      - name: Set cache date
        if: ${{ env.SKIPTESTS == 'false' }}
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # reset cache if env file changed
      - uses: actions/cache@v4
        if: ${{ env.SKIPTESTS == 'false' }}
        with:
          path: ${{ matrix.prefix }}
          key: ${{ matrix.label }}-conda-${{ hashFiles('zen_creator_env.yml') }}-${{ env.DATE }}-${{ env.CACHE_NUMBER }}
        id: cache

      # This step is cached in case the env file was not changed
      - name: Update environment
        if: ${{ env.SKIPTESTS == 'false' && steps.cache.outputs.cache-hit != 'true' }}
        run: mamba env update -f zen_creator_env.yml

      - name: Install package
        if: ${{ env.SKIPTESTS == 'false' }}
        run: pip install -e .

      - name: Run Tests
        if: ${{ env.SKIPTESTS == 'false' }}
        run: pytest --cov="zen_creator" -n auto tests/ -v
